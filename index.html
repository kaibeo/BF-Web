<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý & Tạo Thẻ Account</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* Form Nhập Thông Tin */
        .form-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            height: 42px;
        }

        .btn-submit {
            grid-column: 1 / -1;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #219150;
        }

        /* Danh Sách Account */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-img-container {
            width: 100%;
            height: 180px;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
            flex-grow: 1;
        }

        .card-stt {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .card-info {
            font-size: 14px;
            margin-bottom: 6px;
            color: #555;
        }

        .card-info strong {
            color: #333;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-available {
            background-color: #d4edda;
            color: #155724;
        }

        .status-sold {
            background-color: #f8d7da;
            color: #721c24;
        }

        .btn-delete {
            margin-top: 10px;
            width: 100%;
            padding: 8px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tạo & Quản Lý Thẻ Account</h1>

        <!-- Form Nhập Liệu -->
        <div class="form-container">
            <form id="accForm" class="form-grid">
                <div class="form-group">
                    <label for="stt">Số Thứ Tự (STT):</label>
                    <input type="text" id="stt" placeholder="Ví dụ: ACC-001" required>
                </div>

                <div class="form-group">
                    <label for="accTitle">Tên/Mã Acc:</label>
                    <input type="text" id="accTitle" placeholder="Ví dụ: Acc Game VIP 10" required>
                </div>

                <div class="form-group">
                    <label for="accPrice">Giá Bán:</label>
                    <input type="text" id="accPrice" placeholder="Ví dụ: 500.000 VNĐ" required>
                </div>

                <div class="form-group">
                    <label for="accStatus">Trạng Thái:</label>
                    <select id="accStatus">
                        <option value="available">Còn Hàng</option>
                        <option value="sold">Đã Bán</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="accImage">Upload Ảnh Acc:</label>
                    <input type="file" id="accImage" accept="image/*" required>
                </div>

                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="accDetails">Thông Tin Chi Tiết (Tướng, Skin, Server...):</label>
                    <textarea id="accDetails" placeholder="Nhập chi tiết thông tin tài khoản tại đây..."></textarea>
                </div>

                <button type="submit" class="btn-submit">+ Thêm Account Vào Danh Sách</button>
            </form>
        </div>

        <!-- Khung Hiển Thị Danh Sách Thẻ -->
        <div class="cards-grid" id="cardsGrid">
            <!-- Thẻ Account sẽ tự động thêm vào đây bằng Javascript -->
        </div>
    </div>

    <script>
        const accForm = document.getElementById('accForm');
        const cardsGrid = document.getElementById('cardsGrid');

        accForm.addEventListener('submit', function(e) {
            e.preventDefault();

            // Lấy giá trị từ Form
            const stt = document.getElementById('stt').value;
            const title = document.getElementById('accTitle').value;
            const price = document.getElementById('accPrice').value;
            const status = document.getElementById('accStatus').value;
            const details = document.getElementById('accDetails').value;
            const imageInput = document.getElementById('accImage');

            const file = imageInput.files[0];

            if (file) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    const imageUrl = e.target.result;

                    // Tạo phần tử Card mới
                    const card = document.createElement('div');
                    card.className = 'card';

                    const statusClass = status === 'available' ? 'status-available' : 'status-sold';
                    const statusText = status === 'available' ? 'Còn Hàng' : 'Đã Bán';

                    card.innerHTML = `
                        <div class="card-stt">#${stt}</div>
                        <div class="card-img-container">
                            <img src="${imageUrl}" alt="Ảnh Account">
                        </div>
                        <div class="card-content">
                            <div class="card-title">${title}</div>
                            <div class="card-info"><strong>Giá:</strong> ${price}</div>
                            <div class="card-info">
                                <strong>Trạng thái:</strong> 
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <div class="card-info" style="margin-top: 8px;">
                                <strong>Chi tiết:</strong><br>
                                <span style="white-space: pre-line;">${details}</span>
                            </div>
                            <button class="btn-delete" onclick="deleteCard(this)">Xóa Acc</button>
                        </div>
                    `;

                    // Thêm Card vào danh sách
                    cardsGrid.appendChild(card);

                    // Reset form sau khi thêm thành công
                    accForm.reset();
                };

                reader.readAsDataURL(file);
            }
        });

        // Hàm xóa thẻ
        function deleteCard(button) {
            const card = button.closest('.card');
            card.remove();
        }
    </script>
</body>
  </html>
