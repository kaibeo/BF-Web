<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý & Tạo Thẻ Account VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --discount: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Form Nhập Thông Tin */
        .form-container {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-sub);
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            height: 42px;
        }

        .btn-submit {
            grid-column: 1 / -1;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
        }

        /* Danh Sách Account */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        /* Thẻ Account Modern */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            border-color: rgba(99, 102, 241, 0.4);
        }

        /* Ảnh Ngang 16:9 chuẩn Game/Acc */
        .card-img-container {
            width: 100%;
            aspect-ratio: 16 / 9; /* Ép khung ảnh chuẩn ngang 16:9 */
            background-color: #0f172a;
            position: relative;
            overflow: hidden;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .card:hover .card-img-container img {
            transform: scale(1.05);
        }

        .card-stt {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2;
        }

        .discount-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
            z-index: 2;
        }

        .card-content {
            padding: 18px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        /* Khu vực Giá */
        .price-box {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 12px;
            background: rgba(15, 23, 42, 0.5);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .price-current {
            font-size: 18px;
            font-weight: 800;
            color: #10b981;
        }

        .price-old {
            font-size: 13px;
            color: var(--text-sub);
            text-decoration: line-through;
        }

        .card-info {
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-sub);
            line-height: 1.5;
        }

        .card-info strong {
            color: #cbd5e1;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-available {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-sold {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .details-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #cbd5e1;
            margin-top: 8px;
            white-space: pre-line;
            border-left: 2px solid var(--primary);
            flex-grow: 1;
        }

        .btn-delete {
            margin-top: 14px;
            width: 100%;
            padding: 9px;
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tạo & Quản Lý Thẻ Account</h1>

        <!-- Form Nhập Liệu -->
        <div class="form-container">
            <form id="accForm" class="form-grid">
                <div class="form-group">
                    <label for="stt">Mã / Số Thứ Tự (STT):</label>
                    <input type="text" id="stt" placeholder="Ví dụ: MS-001" required>
                </div>

                <div class="form-group">
                    <label for="accTitle">Tên Account:</label>
                    <input type="text" id="accTitle" placeholder="Ví dụ: Acc Roblox VIP Full V4" required>
                </div>

                <div class="form-group">
                    <label for="accPrice">Giá Gốc (VNĐ):</label>
                    <input type="number" id="accPrice" placeholder="Ví dụ: 500000" required>
                </div>

                <div class="form-group">
                    <label for="accDiscount">Giảm Giá (%):</label>
                    <input type="number" id="accDiscount" placeholder="Ví dụ: 20 (Nhập 0 nếu không giảm)" min="0" max="100" value="0">
                </div>

                <div class="form-group">
                    <label for="accStatus">Trạng Thái:</label>
                    <select id="accStatus">
                        <option value="available">Còn Hàng</option>
                        <option value="sold">Đã Bán</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="accImage">Ảnh Ngang Acc (16:9):</label>
                    <input type="file" id="accImage" accept="image/*" required>
                </div>

                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="accDetails">Thông Tin Chi Tiết:</label>
                    <textarea id="accDetails" placeholder="Nhập chi tiết: Tướng, Skin, Server, Email..."></textarea>
                </div>

                <button type="submit" class="btn-submit">+ ĐĂNG BÁN ACCOUNT</button>
            </form>
        </div>

        <!-- Danh Sách Thẻ -->
        <div class="cards-grid" id="cardsGrid">
            <!-- Thẻ Acc sẽ được thêm vào đây -->
        </div>
    </div>

    <script>
        const accForm = document.getElementById('accForm');
        const cardsGrid = document.getElementById('cardsGrid');

        // Định dạng tiền tệ VNĐ
        function formatMoney(amount) {
            return new Intl.NumberFormat('vi-VN').format(amount) + 'đ';
        }

        accForm.addEventListener('submit', function(e) {
            e.preventDefault();

            // Lấy dữ liệu
            const stt = document.getElementById('stt').value;
            const title = document.getElementById('accTitle').value;
            const originalPrice = parseFloat(document.getElementById('accPrice').value);
            const discountPercent = parseFloat(document.getElementById('accDiscount').value) || 0;
            const status = document.getElementById('accStatus').value;
            const details = document.getElementById('accDetails').value;
            const imageInput = document.getElementById('accImage');

            // Tính giá sau giảm
            const finalPrice = originalPrice * (1 - discountPercent / 100);

            const file = imageInput.files[0];

            if (file) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    const imageUrl = e.target.result;

                    // Tạo phần tử Card
                    const card = document.createElement('div');
                    card.className = 'card';

                    const statusClass = status === 'available' ? 'status-available' : 'status-sold';
                    const statusText = status === 'available' ? 'Còn Hàng' : 'Đã Bán';

                    // HTML phần Giá & Giảm giá
                    let priceHTML = '';
                    let discountBadge = '';

                    if (discountPercent > 0) {
                        discountBadge = `<div class="discount-tag">-${discountPercent}%</div>`;
                        priceHTML = `
                            <span class="price-current">${formatMoney(finalPrice)}</span>
                            <span class="price-old">${formatMoney(originalPrice)}</span>
                        `;
                    } else {
                        priceHTML = `<span class="price-current">${formatMoney(originalPrice)}</span>`;
                    }

                    card.innerHTML = `
                        <div class="card-stt">#${stt}</div>
                        ${discountBadge}
                        <div class="card-img-container">
                            <img src="${imageUrl}" alt="Ảnh Account">
                        </div>
                        <div class="card-content">
                            <div class="card-title">${title}</div>
                            
                            <div class="price-box">
                                ${priceHTML}
                            </div>

                            <div class="card-info">
                                <strong>Trạng thái:</strong> 
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>

                            ${details ? `<div class="details-box">${details}</div>` : ''}

                            <button class="btn-delete" onclick="deleteCard(this)">Xóa Account</button>
                        </div>
                    `;

                    // Đưa vào giao diện
                    cardsGrid.prepend(card);

                    // Reset Form
                    accForm.reset();
                };

                reader.readAsDataURL(file);
            }
        });

        // Hàm Xóa
        function deleteCard(button) {
            if(confirm('Bạn có chắc chắn muốn xóa thẻ này?')) {
                const card = button.closest('.card');
                card.remove();
            }
        }
    </script>
</body>
  </html>
